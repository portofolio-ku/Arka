<html>
 <head>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <style>
   body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }
        .container {
            background-color: #ffffff;
            border-radius: 15px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            padding: 20px;
            width: 90%;
            max-width: 400px;
            text-align: center;
        }
        .logo {
            margin-bottom: 20px;
        }
        .logo img {
            width: 80px;
            height: 80px;
        }
        .input-group {
            margin-bottom: 15px;
        }
        .input-group input {
            width: 100%;
            padding: 10px;
            border: none;
            border-bottom: 1px solid #000000;
            font-size: 16px;
        }
        .button {
            background-color: #d0021b;
            color: #ffffff;
            border: none;
            border-radius: 25px;
            padding: 15px 0;
            width: 100%;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
  </style>
 </head>
 <body>
  <div class="container">
   <div class="logo">
    <img alt="Red star logo" src="logo makam.png"/>
   </div>
   <div class="input-group">
    <input placeholder="Username / Email" type="text"/>
   </div>
   <div class="input-group">
    <input placeholder="Password Baru" type="password"/>
   </div>
   <div class="input-group">
    <input placeholder="Ulangi" type="password"/>
   </div>
   <button class="button">
    Selanjutnya
   </button>
   <br>
   <div class="register">
    sudah punya akun?
    <a href="login.html">
     Login
    </a>
   </div>
  </div>
 </body>
</html>
