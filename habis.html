<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barcode Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f5f5f5;
        }
        .container {
            width: 90%;
            max-width: 400px;
            border: 1px solid #ddd;
            border-radius: 10px;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            text-align: center;
            padding: 20px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid red;
            padding-bottom: 10px;
        }
        .header i {
            font-size: 24px;
            color: red;
        }
        .header h1 {
            font-size: 24px;
            color: red;
            margin: 0;
        }
        .qr-section {
            margin: 20px 0;
        }
        .qr-section p {
            margin: 10px 0;
            font-size: 18px;
        }
        .qr-section .name {
            font-weight: bold;
            font-size: 24px;
        }
        .qr-section .expiry {
            color: red;
        }
        .actions {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }
        .actions i {
            font-size: 24px;
            color: red;
        }
        #qrcode {
            display: flex;
            justify-content: center;
        }
    </style>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet"/>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="homepage.html" class="footer-icon-link">
            <i class="fas fa-arrow-left"></i>
            </a>
        </div>
        <div class="qr-section">
            <p>Perbarui QR <i class="fas fa-sync-alt" onclick="refreshQRCode()"></i></p>
            <div id="qrcode"></div>
            <p class="name">YUSFIANA</p>
            <p>Berlaku hingga <span class="expiry" id="expiry-time">02:00</span></p>
        </div>
        <div class="actions">
            <i class="fas fa-download"></i>
            <i class="fas fa-share-alt"></i>
        </div>
    </div>

    <script>
        let timerInterval;

        function generateQRCode() {
            const qrcodeContainer = document.getElementById('qrcode');
            qrcodeContainer.innerHTML = '';
            new QRCode(qrcodeContainer, {
                text: "https://example.com",
                width: 200,
                height: 200
            });
        }

        function startTimer(duration, display) {
            let timer = duration, minutes, seconds;
            timerInterval = setInterval(function () {
                minutes = parseInt(timer / 60, 10);
                seconds = parseInt(timer % 60, 10);

                minutes = minutes < 10 ? "0" + minutes : minutes;
                seconds = seconds < 10 ? "0" + seconds : seconds;

                display.textContent = minutes + ":" + seconds;

                if (--timer < 0) {
                    clearInterval(timerInterval);
                    document.getElementById('qrcode').innerHTML = '';
                }
            }, 1000);
        }

        function refreshQRCode() {
            clearInterval(timerInterval);
            generateQRCode();
            const twoMinutes = 60 * 2;
            const display = document.querySelector('#expiry-time');
            startTimer(twoMinutes, display);
        }

        window.onload = function () {
            refreshQRCode();
        };
    </script>
</body>
</html>
