  <style>
   body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
        }
        .container {
            max-width: 400;
            margin: 0 auto;
            overflow: hidden;
            background-color: #fff;
        }
        .header {
            display: flex;
            align-items: center;
            padding: 10px;
            background-color: #fff;
        }
        .header img {
            border-radius: 50%;
            width: 50px;
            height: 50px;
            margin-right: auto;
        }
        .header .welcome-text {
            flex-grow: 1;
        }
        .header .welcome-text p {
            margin: 0;
        }
        .header .welcome-text p:first-child {
            font-size: 14px;
            color: #888;
        }
        .header .welcome-text p:last-child {

            font-weight: bold;
        }
        .header .menu-icon {

            color: #e74c3c;
        }
        .title-bar {
            background-color: #e74c3c;
            color: #fff;
            text-align: center;
            padding: 10px;
            font-size: 18px;
            font-weight: bold;
            position: relative;
        }
        .title-bar .star-icon {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 24px;
        }
        .main-image {
            width: 120%;
            height: 75%;

        }
        .search-bar {
            display: flex;
            justify-content: center;
            padding: 10px;
        }
        .search-bar input {
            width: 90%;
            padding: 10px;
            border: 2px solid #e74c3c;
            border-radius: 25px;
            font-size: 16px;
        }
        .list-section, .history-section {
            padding: 10px;
        }
        .list-section .section-title, .history-section .section-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .list-section .list-item, .history-section .list-item {
            display: flex;
            align-items: center;
            background-color: #e74c3c;
            color: #fff;
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 10px;
        }
        .list-section .list-item img, .history-section .list-item img {
            border-radius: 5px;
            width: 50px;
            height: 50px;
            margin-right: 10px;
        }
        .list-section .list-item .item-text, .history-section .list-item .item-text {
            flex-grow: 1;
            font-size: 18px;
        }
        .list-section .list-item .arrow-icon, .history-section .list-item .arrow-icon {
            font-size: 24px;
        }
        .footer {
            display: flex;
            justify-content: space-around;
            align-items: center;
            background-color: #e74c3c;

        }
