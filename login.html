<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>
   Login Page
  </title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet"/>
  <style>
   body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }
        .container {
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            padding: 20px;
            width: 320%;
            max-width: 400px;
            text-align: center;
        }
        .container img {
            width: 90px;
            height: 90px;
            margin-bottom: 20px;
        }
        .container input[type="text"],
        .container input[type="password"] {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: none;
            border-bottom: 1px solid #000;
            font-size: 16px;
        }
        .container a {
            color: #d32f2f;
            text-decoration: none;
            font-size: 14px;
        }
        .container a:hover {
            text-decoration: underline;
        }
        .container button {
            background-color: #d32f2f;
            color: #fff;
            border: none;
            padding: 15px;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            margin: 20px 0;
        }
        .container .social-login {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 20px 0;
        }
        .container .social-login img {
            width: 40px;
            height: 40px;
        }
        .container .register {
            font-size: 14px;
        }
        .container .register a {
            color: #d32f2f;
            font-weight: bold;
        }
  </style>
 </head>
 <body>
  <div class="container">
   <img alt="Red star logo" height="80" src="logo makam.png" width="80"/>
   <form>
    <input placeholder="Username / Email" type="text"/>
    <input placeholder="Password" type="password"/>
    <a href="lupa.html">
     Lupa password?
    </a>
    <a href="homepage.html">
        <button type="button">
          Masuk
        </button>
      </a>
      
   </form>
   <div class="social-login">
    <img alt="Google logo" height="40" src="devicon_google.png" width="40"/>
    <img alt="Facebook logo" height="40" src="fblogo.png" width="40"/>
   </div>
   <div class="register">
    Tidak punya akun?
    <a href="register2.html">
     Daftar
    </a>
   </div>
  </div>
 </body>
</html>
