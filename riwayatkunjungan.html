<html>
 <head>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <style>
   body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #fff;
        }
        .container {
            width: 90%;
            max-width: 400px;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid red;
            padding-bottom: 10px;
        }
        .header img {
            width: 24px;
            height: 24px;
        }
        .header h1 {
            font-size: 20px;
            color: red;
            margin: 0;
        }
        .button {
            display: block;
            width: 100%;
            background-color: red;
            color: white;
            text-align: center;
            padding: 10px;
            border-radius: 20px;
            margin: 20px 0;
            text-decoration: none;
        }
        .section-title {
            color: red;
            font-weight: bold;
            margin: 20px 0 10px;
        }
        .radio-group {
            margin: 10px 0;
        }
        .radio-group label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid red;
        }
        .radio-group input {
            margin-left: 10px;
        }
        .date-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 20px 0;
        }
        .date-group input {
            width: 45%;
            padding: 10px;
            border: 1px solid #000;
            border-radius: 5px;
        }
        .date-group span {
            font-size: 20px;
        }
        .submit-button {
            display: block;
            width: 100%;
            background-color: red;
            color: white;
            text-align: center;
            padding: 10px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 18px;
        }
  </style>
 </head>
 <body>
  <div class="container">
   <div class="header">
    <img alt="Back arrow icon" src="Back.png"/>
    <h1>
     Riwayat
    </h1>
    <a href="homepage.html" class="footer-icon-link">
    <img alt="Home icon" src="HOme.png"/>
    </a>
   </div>
   <a class="button" href="#">
    Histori Kunjungan
   </a>
   <div class="section-title">
    Pilih Metode Pencarian
   </div>
   <div class="radio-group">
    <label>
     Hari ini
     <input name="search-method" type="radio"/>
    </label>
    <label>
     1 Minggu
     <input name="search-method" type="radio"/>
    </label>
    <label>
     1 Bulan
     <input name="search-method" type="radio"/>
    </label>
    <label>
     Pilih Tanggal
     <input name="search-method" type="radio"/>
    </label>
   </div>
   <div class="date-group">
    <input placeholder="Tanggal awal" type="date"/>
    <span>
     —
    </span>
    <input placeholder="Tanggal akhir" type="date"/>
   </div>
   <a class="submit-button" href="#">
    Selanjutnya
   </a>
  </div>
 </body>
</html>
