<html>
 <head>
  <title>
   Profil Pahlawan
  </title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet"/>
  <style>
   body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f5f5f5;
        }
        .container {
            width: 400px;
            text-align: center;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .header i {
            font-size: 24px;
            color: red;
        }
        .header h1 {
            font-size: 18px;
            margin: 0;
            flex-grow: 1;
            text-align: center;
        }
        .profile-img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 10px;
        }
        .name {
            font-size: 18px;
            font-weight: bold;
            margin: 10px 0;
        }
        .info {
            background-color: red;
            color: white;
            padding: 10px;
            margin: 5px 0;
            border-radius: 5px;
        }
        .button {
            display: inline-block;
            padding: 10px 20px;
            margin-top: 20px;
            border: 2px solid red;
            border-radius: 5px;
            color: red;
            text-decoration: none;
            font-weight: bold;
        }
  </style>
 </head>
 <body>
  <div class="container">
   <div class="header">
    <a href="list pahlawan.html">
    <i class="fas fa-arrow-left">  
    </i>
    </a>
    <h1>
     Profil Pahlawan
    </h1>
    <a href="homepage.html">
    <i class="fas fa-home">
    </i>
   </div>
</a>
   <img alt="Profile picture of S. Parman" class="profile-img" src="sparmanHD.jpg"/>
   <div class="name">
    S. Parman
   </div>
   <div class="info">
    Lahir : 4 Agustus 1918, Wonosobo, Hindia Belanda
   </div>
   <div class="info">
    Wafat : 1 Oktober 1965, Lubang Buaya, Jakarta
   </div>
   <div class="info">
    Pangkat : Letnan Jenderal TNI
   </div>

    Kunjungi
   </a>

</html>
