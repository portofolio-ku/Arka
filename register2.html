<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>
   Registration Page
  </title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet"/>
  <style>
   body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }
        .container {
            background-color: #fff;
            border-radius: 15px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            padding: 20px;
            width: 400px;
            text-align: center;
        }
        .container img {
            width: 90px;
            margin-bottom: 20px;
        }
        .container input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: none;
            border-bottom: 1px solid #000;
            font-size: 16px;
        }
        .container button {
            width: 100%;
            padding: 10px;
            background-color: #d32f2f;
            color: #fff;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
        }
        .container .social-login {
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }
        .container .social-login img {
            width: 40px;
            margin: 0 10px;
            cursor: pointer;
        }
        .container p {
            margin: 20px 0 10px;
            font-size: 14px;
            color: #000;
        }
  </style>
 </head>
 <body>
  <div class="container">
   <img alt="Red star logo" src="logo makam.png"/>
   <input placeholder="Email / Phone Number" type="text"/>
   <input placeholder="Username" type="text"/>
   <input placeholder="Password" type="password"/>
   <input placeholder="Konfirmasi Password" type="password"/>
   <button>
    Daftar
   </button>
   <p>
    Atau daftar dengan
   </p>
   <div class="social-login">
    <img alt="Google logo" src="devicon_google.png"/>
    <img alt="Facebook logo" src="fblogo.png"/>
   </div>
</p>
   <div class="register">
    Sudah punya akun?
    <a href="login.html">
     Login
    </a>
   </div>
  </div>
 </body>
</html>
