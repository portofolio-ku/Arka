<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>
   Profile Page
  </title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet"/>
  <style>
   body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #fff;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
            border: 1px solid #ccc;
            border-radius: 10px;
            overflow: hidden;
        }
        .header {
            background-color: #d50000;
            color: white;
            padding: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .header i {
            font-size: 24px;
        }
        .profile {
            display: flex;
            align-items: center;
            padding: 10px;
            background-color: #d50000;
            color: white;
        }
        .profile img {
            border-radius: 50%;
            width: 50px;
            height: 50px;
            margin-right: 10px;
        }
        .profile span {
            font-size: 18px;
            font-weight: bold;
        }
        .menu {
            padding: 10px;
        }
        .menu-item {
            display: flex;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #ccc;
            color: #d50000;
            font-size: 16px;
        }
        .menu-item i {
            margin-right: 10px;
            font-size: 20px;
        }
        .menu-item:last-child {
            border-bottom: none;
        }
  </style>
 </head>
 <body>
  <div class="container">
   <div class="header">
    <a href="homepage.html" class="footer-icon-link">
    <i class="fas fa-arrow-left">
    </i>
</a>
    <i class="fas fa-search">
    </i>
   </div>
   <div class="profile">
    <img alt="Profile picture of a person with a red jacket and a white dog" src="https://placehold.co/50x50"/>
    <span>
     YUSFIANA
    </span>
   </div>
   <div class="menu">
    <div class="menu-item">
    <a href="editprofil.html" class="footer-icon-link">
     <i class="fas fa-user">
     </i>
     </a>
     <span>
      Akun
     </span>
    </div>
    <div class="menu-item">
     <i class="fas fa-shield-alt">
     </i>
     <span>
      Privasi dan Keamanan
     </span>
    </div>
    <div class="menu-item">
     <i class="fas fa-globe">
     </i>
     <span>
      Bahasa Aplikasi
     </span>
    </div>
    <div class="menu-item">
     <i class="fas fa-question-circle">
     </i>
     <span>
      Bantuan
     </span>
    </div>
    <div class="menu-item">
     <i class="fas fa-check-square">
     </i>
     <span>
      Pembaruan Aplikasi
     </span>
    </div>
   </div>
  </div>
 </body>
</html>
